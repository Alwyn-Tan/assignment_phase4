<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password - Future Drinks</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="topbar">
        <a class="brand" href="/">
          <strong>Future Drinks</strong>
        </a>

        <div class="user-nav">
          <span class="user-pill">Signed in as <strong data-auth-user>guest</strong></span>
          <a class="button small" href="/">Shop</a>
          <a class="button small" data-auth-admin-only href="/admin">Admin</a>
          <button class="button small" type="button" data-auth-logout>Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main auth-main">
    <div class="container auth-shell">
      <section class="auth-card">
        <h1>Change Password</h1>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>

        <form id="change-password-form" class="auth-form" autocomplete="off">
          <label class="admin-field">
            <span>Current Password</span>
            <input id="current-password" name="current_password" type="password" minlength="8" maxlength="72" required />
          </label>
          <label class="admin-field">
            <span>New Password</span>
            <input id="new-password" name="new_password" type="password" minlength="8" maxlength="72" required />
          </label>
          <label class="admin-field">
            <span>Confirm New Password</span>
            <input id="confirm-password" name="confirm_password" type="password" minlength="8" maxlength="72" required />
          </label>
          <div class="auth-actions">
            <button class="button primary" type="submit">Update Password</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="js/common/client-utils.js" defer></script>
  <script src="js/common/auth-ui.js" defer></script>
  <script src="js/pages/change-password.js" defer></script>
</body>

</html>
