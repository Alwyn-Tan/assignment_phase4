<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - Future Drinks</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="topbar">
        <a class="brand" href="/">
          <strong>Future Drinks</strong>
        </a>

        <div class="user-nav">
          <span class="user-pill">Hello, <strong data-auth-user>guest</strong></span>
          <a class="button small" href="/">Shop</a>
          <a class="button small" data-auth-guest-only href="/login">Login</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main auth-main">
    <div class="container auth-shell">
      <section class="auth-card">
        <h1>Create Account</h1>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>

        <form id="register-form" class="auth-form" autocomplete="off">
          <label class="admin-field">
            <span>Display Name</span>
            <input id="register-display-name" name="display_name" type="text" maxlength="80" required />
          </label>
          <label class="admin-field">
            <span>Email</span>
            <input id="register-email" name="email" type="email" maxlength="254" required />
          </label>
          <label class="admin-field">
            <span>Password</span>
            <input id="register-password" name="password" type="password" minlength="8" maxlength="72" required />
          </label>
          <label class="admin-field">
            <span>Confirm Password</span>
            <input id="register-confirm-password" name="confirm_password" type="password" minlength="8" maxlength="72" required />
          </label>
          <div class="auth-actions">
            <button class="button primary" type="submit">Register</button>
            <a class="button" href="/login">Back to Login</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="js/common/client-utils.js" defer></script>
  <script src="js/common/auth-ui.js" defer></script>
  <script src="js/pages/register.js" defer></script>
</body>

</html>
